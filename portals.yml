# Personal targeting configuration; see modes/_profile.md and modes/_custom.md.
# Remote and missing locations require a separate Washington eligibility review.
title_filter:
  positive:
  - Data Analyst
  - Data Analytics
  - Analytics Engineer
  - Business Intelligence
  - BI Analyst
  - BI Developer
  - Reporting Analyst
  - Data Quality
  - Data Governance
  - Data Management
  - Operations Analyst
  - Operational Analyst
  - Research Analyst
  - Research and Data
  - Institutional Research
  - Performance Analyst
  - Data and Performance
  - Data & Performance
  - Program Analyst
  - Program Evaluation
  - Decision Support
  - Business Systems Analyst
  - Product Analyst
  - Statistical
  negative:
  - word:Intern
  - word:Interns
  - Internship
  - Director
  - Vice President
  - word:VP
  - Head of
  seniority_boost:
  - Senior
  - Sr.
location_filter:
  allow:
  - Seattle
  - Bellevue
  - Kirkland
  - Redmond
  - Bothell
  - Issaquah
  - Remote
visa_filter:
  enabled: false
search_queries:
- name: Local DA and AE
  query: ("data analyst" OR "analytics engineer" OR "business intelligence") ("Seattle" OR "Bellevue"
    OR "Kirkland" OR "Redmond") -site:linkedin.com
  enabled: true
- name: Local operations and quality
  query: ("operations analyst" OR "data quality" OR "reporting analyst" OR "data governance") ("Seattle"
    OR "Bellevue" OR "Kirkland" OR "Bothell" OR "Issaquah") -site:linkedin.com
  enabled: true
- name: Government data and performance
  query: site:governmentjobs.com/careers ("Seattle" OR "Bellevue" OR "Kirkland" OR "Redmond" OR "King
    County") ("data" OR "performance" OR "research" OR "evaluation")
  enabled: true
- name: WA state agencies
  query: site:governmentjobs.com/careers/washington ("data analyst" OR "research" OR "business intelligence"
    OR "statistical")
  enabled: true
- name: Higher education
  query: ("institutional research" OR "reporting analyst" OR "data analyst") ("University of Washington"
    OR "Bellevue College" OR "Lake Washington Institute of Technology" OR "Seattle Colleges")
  enabled: true
- name: Healthcare analytics
  query: ("EvergreenHealth" OR "Overlake" OR "UW Medicine" OR "Seattle Children" OR "Fred Hutch" OR "Providence")
    ("data analyst" OR "business intelligence" OR "decision support") careers
  enabled: true
- name: Insurance analytics
  query: ("Premera" OR "Regence" OR "Cambia" OR "Symetra" OR "PEMCO") ("data analyst" OR "analytics" OR
    "business intelligence") careers
  enabled: true
- name: Utilities and transit
  query: ("Puget Sound Energy" OR "Seattle City Light" OR "Seattle Public Utilities" OR "Sound Transit"
    OR "Port of Seattle") ("analyst" OR "analytics" OR "data") careers
  enabled: true
- name: Remote Greenhouse
  query: (site:job-boards.greenhouse.io OR site:boards.greenhouse.io) ("data analyst" OR "analytics engineer"
    OR "business intelligence") "remote" ("United States" OR "Washington")
  enabled: true
- name: Remote Workday
  query: site:myworkdayjobs.com ("data analyst" OR "analytics engineer" OR "business intelligence") "remote"
    ("United States" OR "Washington")
  enabled: true
- name: Remote Lever and Ashby
  query: (site:jobs.lever.co OR site:jobs.ashbyhq.com) ("data analyst" OR "analytics engineer" OR "BI
    analyst") "remote" ("United States" OR "Washington")
  enabled: true
